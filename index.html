    <script>
      const testimonials = [
        {
          html: `<p>I've been using Claude Code for a couple of days, and it has been <strong>absolutely ruthless</strong> in chewing through legacy bugs in my gnarly old code base. It's like a <em>wood chipper fueled by dollars</em>...</p>

        },
        {
          html: `<p>Claude Code Opus 4.5 is <em>the most amazing coding engine I've ever used</em>.</p>

        {
          html: `<p>The world changed last week—Opus 4.5 is <em>the best coding model I've ever used</em>.</p>

        {
          html: `<p>Claude Code is <strong>Terrifyingly Powerful</strong>!</p>

        {

<p>- Supercharges all agents</p>

        {
          html: `<p>Most AI needs you to write a novel to get decent output. <em>Claude works with scraps and still nails it</em>.</p>

        {
          html: `<p>More non-engineers should be learning to use Claude Code...</p>

        {

          link: "https://x.com/jxnlco/status/1983598729241219113"
        },
        {
          html: `<p>Actually CRAZY how fast Claude Code is evolving 🦾</p>
<p>It's basically a <em>headless version of Cursor</em> that's super customizable. Code quality is great and custom command are <strong>INCREDIBLY powerful</strong> 🔥</p>`,
          author: "@tedx_ai",
          link: "https://x.com/tedx_ai/status/1900791433218716119"
        },
        {
          html: `<p>One of the subtle features of Claude Code that I love the most is being able to <em>interject additional instructions to a running agent</em> without stopping it.</p>

          link: "https://x.com/alec_helbling/status/2001353835747705280"
        },
        {
          html: `<p>Claude opus is so insanely OP: pass it handfuls of 300+ line files, ask for changes, and it <em>spits them back perfectly</em>—GPT-4 makes weird stray changes or omissions, but Claude <strong>nails it every time</strong>.</p>`,

          link: "https://x.com/ChaseMc67/status/1768761657344598319"
        },
        {
          html: `<p>Anthropic's models are really special... Claude is the only one who can tackle a new coding task it's not familiar with for 20 minutes, <em>iteratively self-correct and finish</em>—others like GPT/Gemini <strong>get stuck in loops</strong>.</p>`,
          author: "@Ji_Ha_Kim",
          link: "https://x.com/Ji_Ha_Kim/status/1996609341319709142"
        },
        {
          html: `<p>Claude 4.5 Sonnet just refactored my entire codebase in one call. <em>25 tool invocations. 3,000+ new lines. 12 brand new files.</em></p>

<p>None of it worked. But boy was it <strong>beautiful</strong>.</p>`,
          author: "@vasuman",
          link: "https://x.com/vasuman/status/1972741452276072839"
        },
        {
          html: `<p>I'm sorry for making another model praising filler post, but Claude Code + Opus 4.5 is simply <strong>incredible</strong>.</p>
<p>I don't get how it is so fast given the model's size. It completely changed my workflow again. It is just <em>too effective for real world coding</em>.</p>
<p>Truly a new <strong>Sonnet 3.5 moment</strong></p>`,

          link: "https://x.com/VictorTaelin/status/1995323767816347933"
        },
        {
          html: `<p>Most people use Claude Code wrong...</p>
<p>The real power comes from customization: CLAUDE .md → project-level system prompt, Skills → encode domain & style preferences, Hooks → enforce conventions in real time...</p>
<p>Tuned Claude = <em>senior engineer who knows your codebase</em>.</p>
<p>Spend a few hours configuring once. Get <strong>compounding leverage forever</strong>.</p>`,

        },
        {
          html: `<p>Claude Code is only as good as your docs + architecture.</p>

<p>gave it a well-structured repo with README, architecture docs, ADRs = <em>deployed features in minutes</em>.</p>

          link: "https://x.com/saen_dev/status/2001567202538037516"
        },
        {
          html: `<p>I'm SO impressed by Claude Skills. They are <em>the best way to package custom instructions</em> (and code) for the agent to access...</p>
<p>I used the skill-creator skill... to create a skill for designing a presentation like Steve Jobs or Seth Godin, then used that skill to create a PPT about Claude Code...</p>

          link: "https://x.com/nityeshaga/status/1980635966776684613"

        {
          html: `<p>Until now, most AI coding tools were blind. They guessed. They hallucinated...</p>

          link: "https://x.com/somi_ai/status/2001791574766928199"
        },
        {
          html: `<p>Claude Opus 4.5 is the single greatest leap in AI coding we've ever seen</p>
<p>Now <em>ANYONE no matter your skill level</em> can build amazing apps <strong>without knowing how to code</strong></p>`,
          author: "@AlexFinn",
          link: "https://x.com/AlexFinn/status/1993089230789300627"
        },
        {
          html: `<p>Gave Claude Code (Sonnet 4.5) a single prompt…</p>
<p>It designed the <em>whole Banking App UI/UX in one shot</em>. No iterations. No tweaks.</p>
<p>AI is moving <strong>fast</strong>...</p>`,
          author: "@prayag_dalal",
          link: "https://x.com/prayag_dalal/status/2001257542237008339"
        },
        {
          html: `<p>Claude winning code generation makes sense. It's better at understanding context and <em>following instructions precisely</em>.</p>

          link: "https://x.com/saen_dev/status/2001009506126586077"

        {
          html: `<p>This is pure gold for anyone diving deep into Claude Code. The <em>persistent memory setup</em> alone is a game-changer—letting it "remember" past sessions without you micromanaging.</p>

        },
        {
          html: `<p>Why I switched from Cursor to Claude Code + VS Code Extension:</p>

          link: "https://x.com/trq212/status/1993786550656897491"
        },
        {
          html: `<p>🤖 Anthropic just released a detailed study revealing that their engineers now rely on Claude for <em>60% of their daily work</em>, resulting in a self-reported <em>50% productivity increase</em>...</p>

        },
        {
          html: `<p>Claude Code from Anthropic... Guys, you can give it very long running tasks and it will <em>just keep going</em>.</p>

        },
        {
          html: `<p>With the same model (sonnet 4), I'm getting <em>better 'one-shot' results</em> from Claude Code than I get from Cursor...</p>

        },
        {
          html: `<p>Claude Code crawls codebases to a degree <em>never seen from Cursor</em>: one-shots bugs unsolved for days—superior at navigation and self-improvement over GPT loops.</p>`,
          author: "@rahulgs",
          link: "https://x.com/rahulgs/status/1902342317597511909"
        },
        {

      let currentIndex = 0;

      function renderTestimonial(index) {
        const t = testimonials[index];
        const contentEl = document.getElementById('testimonial-content');
        const authorEl = document.getElementById('testimonial-author');

        // Set content
        contentEl.innerHTML = t.html;
        authorEl.innerHTML = '— <a href="' + t.link + '" target="_blank">' + t.author + '</a>';

        // Apply Rough Notation after a short delay
        setTimeout(function() {
          var els = document.querySelectorAll('blockquote em, blockquote strong');
          var group = [];

          for (var i = 0; i < els.length; i++) {
            group.push(
              RoughNotation.annotate(els[i],
              els[i].tagName.toLowerCase() === 'em'
                      ? { type: 'highlight', color: '#fff176', multiline: true }
                      : { type: 'underline', color: '#f44336', multiline: true }
            ));
          }

          RoughNotation.annotationGroup(group).show();
        }, 100);
      }

      document.getElementById('next-post').addEventListener('click', function(e) {
        e.preventDefault();
        currentIndex = (currentIndex + 1) % testimonials.length;
        renderTestimonial(currentIndex);

        // Update URL without reload
        history.pushState({index: currentIndex}, '', '#' + (currentIndex + 1));
      });

      // Handle browser back/forward
      window.addEventListener('popstate', function(e) {
        if (e.state && typeof e.state.index !== 'undefined') {
          currentIndex = e.state.index;
          renderTestimonial(currentIndex);
        }
      });

      // Initialize from URL hash or random
      function init() {
        var hash = window.location.hash.slice(1);
        if (hash && !isNaN(parseInt(hash))) {
          currentIndex = Math.min(parseInt(hash) - 1, testimonials.length - 1);
          currentIndex = Math.max(0, currentIndex);
        } else {
          currentIndex = Math.floor(Math.random() * testimonials.length);
        }
        renderTestimonial(currentIndex);
        history.replaceState({index: currentIndex}, '', '#' + (currentIndex + 1));
      }

      init();

      // Easter egg for the curious ones
      console.log(`%c
